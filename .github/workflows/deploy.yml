name: Deploy Hugo site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash
    working-directory: hugo-site

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Hugo Blox blox-tailwind v0.10.0 requires Hugo >= 0.148.2 (extended)
      HUGO_VERSION: 0.148.2
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb
          sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Node.js dependencies (Tailwind CLI, Pagefind)
        run: "[[ -f package-lock.json || -f npm-shrinkwrap.json ]] && npm ci || npm install"

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
          TZ: America/Detroit
        # baseURL comes from hugo.yaml (always https://), never from the CI output,
        # which can resolve to http:// and poison canonical URLs and the sitemap.
        run: PATH="$PWD/node_modules/.bin:$PATH" hugo --gc --minify

      - name: Build Pagefind search index
        run: npx pagefind --site public

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./hugo-site/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
